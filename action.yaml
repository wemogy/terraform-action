name: Terraform (wemogy)
author: wemogy
description: Connects to a Terraform backend, applies or plans the changes and outputs the Terraform Output variables
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  working-directory:
    required: true
    description: "The directory of your terraform scripts"
  workspace:
    description: "The terraform workspace"
    required: false
  plan:
    description: "Plan the changes"
    default: "false"
    required: true
  apply:
    description: "Apply the changes"
    default: "true"
    required: true
  destroy:
    description: "Destroy the changes"
    default: "false"
    required: true
  force:
    description: "Enforce changes, even if prevent_destroy is set to 'true'"
    default: "false"
    required: true
  client-id:
    description: "The Azure Service Principal / Managed Identity Client ID"
    required: true
  client-secret:
    description: "The Azure Service Principal Secret. Leave empty to authenticate via OIDC (federated credentials)."
    required: false
    default: ""
  tenant-id:
    description: "The Azure Service Principal Tenant ID"
    required: true
  subscription-id:
    description: "The Azure Subscription ID. Required when authenticating via OIDC."
    required: false
    default: ""
  backend-storage-account-name:
    description: "The Name of the Azure Storage Account that hosts the remote Terraform backend"
    required: true
  backend-container-name:
    description: "The Name of the the storage container that hosts the remote Terraform backend"
    required: true
  backend-key:
    description: "The name of the file that hosts the remote Terraform backend"
    required: true
  terraform-version:
    description: "The Terraform CLI version to install (e.g. '1.14.0' or '~1.14'). Pinning a version skips the 'latest' lookup and makes runs reproducible."
    required: false
    default: "latest"
  cache-providers:
    description: "Cache downloaded Terraform providers between runs (keyed on .terraform.lock.hcl)"
    required: false
    default: "true"
  upgrade:
    description: "Run 'terraform init -upgrade' to pick the newest provider/module versions allowed by the constraints instead of the versions recorded in .terraform.lock.hcl"
    required: false
    default: "false"
  azure-cli-login:
    description: "Also log in to the Azure CLI. Terraform does not need this (it authenticates via ARM_* environment variables); only enable it if your Terraform code calls the 'az' CLI (e.g. in local-exec provisioners or external data sources)."
    required: false
    default: "false"

outputs:
  output:
    description: "The Terraform output in JSON format"
    value: ${{ steps.terraform-output.outputs.output }}

runs:
  using: "composite"
  steps:
    # Check if 'force' is set.
    # If so, this script replaces 'prevent_destroy = true' with 'prevent_destroy = false' in all .tf files
    # see: https://notes.rioastamal.net/2020/03/terraform-force-destroy-resource-when-prevent-destroy-true.html
    - name: Remove prevent_destroy (force)
      if: ${{ inputs.force == 'true' }}
      run: find . -name '*.tf' -type f -exec perl -i -pe 's@prevent_destroy = true@prevent_destroy = false@g' {} \;
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    # Setup terraform. The wrapper is disabled: it adds a Node.js process around every
    # terraform call and its stdout/stderr outputs are not used by this action.
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    # Expose the credentials to Terraform's azurerm provider and backend.
    # The backend authenticates against the state storage account via Azure AD (use_azuread_auth),
    # so no storage account access key is needed. With ARM_USE_OIDC, Terraform requests the
    # GitHub OIDC token itself, so no Azure CLI login is required.
    - name: Configure Terraform environment
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        TENANT_ID: ${{ inputs.tenant-id }}
        SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        CACHE_PROVIDERS: ${{ inputs.cache-providers }}
      run: |
        {
          echo "TF_IN_AUTOMATION=true"
          echo "ARM_CLIENT_ID=$CLIENT_ID"
          echo "ARM_TENANT_ID=$TENANT_ID"
          echo "ARM_USE_AZUREAD=true"
          if [[ -n "$SUBSCRIPTION_ID" ]]; then
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          fi
          if [[ -z "$CLIENT_SECRET" ]]; then
            echo "ARM_USE_OIDC=true"
          else
            echo "ARM_CLIENT_SECRET=$CLIENT_SECRET"
          fi
          if [[ "$CACHE_PROVIDERS" == "true" ]]; then
            # Terraform only uses cached providers that match the checksums in a committed
            # .terraform.lock.hcl, so lock file verification stays fully intact.
            echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache"
          fi
        } >> "$GITHUB_ENV"
        if [[ "$CACHE_PROVIDERS" == "true" ]]; then
          mkdir -p "$HOME/.terraform.d/plugin-cache"
        fi

    # Restore / save the provider plugin cache, so providers like azurerm (~100 MB)
    # are not downloaded from the registry on every run.
    - name: Cache Terraform providers
      # Without a committed lock file Terraform would not use the cache, so skip it entirely.
      if: ${{ inputs.cache-providers == 'true' && hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.working-directory)) != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.terraform.d/plugin-cache
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.working-directory)) }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-${{ runner.arch }}-

    # Only needed when the Terraform code itself calls the az CLI.
    - name: Azure CLI Login (OIDC)
      if: ${{ inputs.azure-cli-login == 'true' && inputs.client-secret == '' }}
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    - name: Azure CLI Login (Client Secret)
      if: ${{ inputs.azure-cli-login == 'true' && inputs.client-secret != '' }}
      uses: azure/login@v2
      with:
        allow-no-subscriptions: true
        creds: '{"clientId":"${{ inputs.client-id }}","clientSecret":"${{ inputs.client-secret }}","tenantId":"${{ inputs.tenant-id }}"}'

    # Initialize terraform
    - name: Init Terraform
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BACKEND_STORAGE_ACCOUNT_NAME: ${{ inputs.backend-storage-account-name }}
        BACKEND_CONTAINER_NAME: ${{ inputs.backend-container-name }}
        BACKEND_KEY: ${{ inputs.backend-key }}
        UPGRADE: ${{ inputs.upgrade }}
      run: |
        args=(-input=false -reconfigure)
        if [[ "$UPGRADE" == "true" ]]; then
          args+=(-upgrade)
        fi
        terraform init "${args[@]}" \
          -backend-config="storage_account_name=$BACKEND_STORAGE_ACCOUNT_NAME" \
          -backend-config="container_name=$BACKEND_CONTAINER_NAME" \
          -backend-config="key=$BACKEND_KEY" \
          -backend-config="use_azuread_auth=true"

    # Switch terraform workspace
    - name: Switch workspace
      if: ${{ inputs.workspace != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        echo "Switching workspace to $WORKSPACE..."
        terraform workspace select "$WORKSPACE"

    # Plan the terraform changes. When an apply / destroy follows, the plan is saved and
    # applied as-is, so Terraform does not refresh and plan a second time.
    - name: Plan terraform
      id: plan
      if: ${{ inputs.plan == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPLY: ${{ inputs.apply }}
        DESTROY: ${{ inputs.destroy }}
      run: |
        args=(-input=false)
        if [[ "$APPLY" != "true" && "$DESTROY" == "true" ]]; then
          args+=(-destroy)
        fi
        if [[ "$APPLY" == "true" || "$DESTROY" == "true" ]]; then
          plan_file="$(mktemp "$RUNNER_TEMP/terraform-XXXXXX.tfplan")"
          args+=("-out=$plan_file")
          echo "file=$plan_file" >> "$GITHUB_OUTPUT"
        fi
        echo "Running terraform plan..."
        terraform plan "${args[@]}"

    # Apply / Destroy
    - name: Apply / Destroy terraform
      if: ${{ inputs.apply == 'true' || inputs.destroy == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APPLY: ${{ inputs.apply }}
        PLAN_FILE: ${{ steps.plan.outputs.file }}
      run: |
        if [[ -n "$PLAN_FILE" ]]; then
          echo "Applying saved plan..."
          terraform apply -input=false "$PLAN_FILE"
        elif [[ "$APPLY" == "true" ]]; then
          echo "Running terraform apply..."
          terraform apply -auto-approve -input=false
        else
          echo "Running terraform destroy..."
          terraform destroy -auto-approve -input=false
        fi

    # Saved plans contain variable values and resource data in cleartext, so remove the plan
    # file even when planning / applying failed or the run was cancelled.
    - name: Remove saved plan
      if: ${{ always() && steps.plan.outputs.file != '' }}
      shell: bash
      env:
        PLAN_FILE: ${{ steps.plan.outputs.file }}
      run: rm -f "$PLAN_FILE"

    # Export terraform outputs to output of this job
    - name: Terraform Output
      id: terraform-output
      working-directory: ${{ inputs.working-directory }}
      run: |
        TERRAFORM_OUTPUT=$(terraform output -json | jq -c .)
        echo "output=$TERRAFORM_OUTPUT" >> "$GITHUB_OUTPUT"
      shell: bash
